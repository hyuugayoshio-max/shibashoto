<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
<meta name="format-detection" content="telephone=no, email=no, address=no">
<title>メッセージ</title>
<!-- 2話 S9 赤奈→芝育秋 初回メッセージ（SMS版）／時間設定1028版：S9 えつ宅 10/11(日) 23:01〜
     電話番号は架空（090-0で始まる番号は国内で割り当てのない帯） -->
<style>
  :root {
    --bg: #ffffff;
    --fg: #111111;
    --sub: #8a8a8e;
    --in-bg: #e9e9eb;
    --in-fg: #111111;
    --out-bg: #3fc35f;
    --out-fg: #ffffff;
    --fs: 16px;
  }
  @media (max-width: 379.98px) { :root { --fs: 15px; } }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans CJK JP", "Yu Gothic UI", "Meiryo", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  img { -webkit-user-drag: none; pointer-events: none; }

  .app { position: fixed; inset: 0; display: flex; flex-direction: column; height: 100dvh; }

  /* ステータスバー */
  .status {
    flex: none;
    padding: 0 26px 0 30px;
  }
  .status-inner {
    height: 40px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .clock { font-size: 16px; font-weight: 600; letter-spacing: .01em; }
  .status-right { display: flex; align-items: center; gap: 5px; }
  .status-right svg { display: block; }
  .net { font-size: 14px; font-weight: 600; margin-right: 1px; }

  /* ヘッダー（相手） */
  .header {
    flex: none;
    position: relative;
    display: flex; flex-direction: column; align-items: center;
    padding: 4px 16px 8px;
  }
  .back {
    position: absolute; left: 14px; top: 10px;
    width: 40px; height: 40px; border-radius: 50%;
    background: #f4f4f6; border: 1px solid #e4e4e8;
    display: flex; align-items: center; justify-content: center;
  }
  .h-avatar { width: 54px; height: 54px; }
  .h-avatar svg { display: block; width: 100%; height: 100%; }
  .number {
    margin-top: -6px;
    padding: 5px 12px 5px 14px;
    border-radius: 16px;
    background: #fff; border: 1px solid #e4e4e8;
    font-size: 15px; font-weight: 700; letter-spacing: .01em;
    display: flex; align-items: center; gap: 4px;
    position: relative;
  }
  .number svg { display: block; }

  /* トーク */
  .talk {
    flex: 1; min-height: 0;
    overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    scrollbar-width: none;
    touch-action: pan-y;
    padding: 6px 14px 10px;
    display: flex; flex-direction: column-reverse;
  }
  .talk::-webkit-scrollbar { display: none; }
  .talk-inner { margin-bottom: auto; }

  .label {
    text-align: center;
    color: var(--sub);
    font-size: 11px; line-height: 1.4;
    margin: 4px 0 10px;
  }

  .row { display: flex; margin-top: 2px; }
  .row.gap { margin-top: 10px; }
  .row.in { justify-content: flex-start; }
  .row.out { justify-content: flex-end; }

  .bubble {
    position: relative;
    font-size: var(--fs);
    line-height: 1.4;
    padding: 7px 12px;
    border-radius: 18px;
    max-width: 86%;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-break: strict;
  }
  .in .bubble  { background: var(--in-bg);  color: var(--in-fg); }
  .out .bubble { background: var(--out-bg); color: var(--out-fg); }

  /* しっぽ（グループ最後の吹き出しだけ） */
  .bubble.tail::before, .bubble.tail::after { content: ""; position: absolute; bottom: 0; height: 18px; }
  .in .bubble.tail::before  { left: -6px;  width: 18px; background: var(--in-bg);  border-bottom-right-radius: 14px; }
  .in .bubble.tail::after   { left: -10px; width: 10px; background: var(--bg);     border-bottom-right-radius: 9px; }
  .out .bubble.tail::before { right: -6px; width: 18px; background: var(--out-bg); border-bottom-left-radius: 14px; }
  .out .bubble.tail::after  { right: -10px; width: 10px; background: var(--bg);    border-bottom-left-radius: 9px; }

  .photo {
    /* 画面の高さ（上下の余白を除く）に合わせて大きさを決める。縦横比 3:4 を幅・高さ両方で指定 */
    --avail: calc(100vh - 495px);
    width:  max(110px, min(62vw, 240px, calc(var(--avail) * 0.75)));
    height: max(147px, min(82.67vw, 320px, var(--avail)));
    border-radius: 16px;
    overflow: hidden;
    background: #e2e2e6;
    flex: none;
  }
  @supports (height: 100dvh) {
    .photo { --avail: calc(100dvh - 495px); }
  }
  .photo img { display: block; width: 100%; height: 100%; object-fit: cover; }

  /* 入力欄 */
  .inputbar {
    flex: none;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px 10px;
  }
  .plus {
    width: 38px; height: 38px; border-radius: 50%; flex: none;
    background: #f4f4f6; border: 1px solid #e4e4e8;
    display: flex; align-items: center; justify-content: center;
  }
  .field {
    flex: 1; min-width: 0; height: 38px;
    border-radius: 19px; border: 1px solid #dcdce0; background: #fff;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px 0 14px;
    color: #b0b0b5; font-size: 15px;
  }
  .field span { white-space: nowrap; overflow: hidden; }
  .field svg { flex: none; display: block; }
</style>
</head>

<script>
/* 長押し・拡大・ページスクロールの抑止 */
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());
document.addEventListener('dragstart', e => e.preventDefault());
['gesturestart', 'gesturechange', 'gestureend'].forEach(t =>
  document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => {
  if (e.touches.length > 1) { e.preventDefault(); return; }
  if (!e.target.closest('#talk')) e.preventDefault();
}, { passive: false });
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouchEnd < 350) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });
</script>
